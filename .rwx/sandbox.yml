on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.1.0
    with:
      repository: https://github.com/rwx-research/captain.git
      ref: ${{ init.commit-sha }}
      preserve-git-dir: true

  - key: tool-versions
    use: code
    call: rwx/tool-versions 1.1.0
    filter:
      - .tool-versions

  - key: go-installation
    call: golang/install 1.3.0
    with:
      go-version: ${{ tasks.tool-versions.values.golang }}

  - key: go
    use: go-installation
    run: echo "$(go env GOPATH)/bin" > "$MINT_ENV/PATH"

  - key: go-deps
    use: [go, code]
    call: golang/mod-download 1.1.0
    filter: [go.mod, go.sum]
    with:
      tool-cache: captain-go-deps

  - key: go-tools
    use: go
    run: |
      go install github.com/magefile/mage@v${{ tasks.tool-versions.values.mage }}
      go install github.com/onsi/ginkgo/v2/ginkgo@v${{ tasks.tool-versions.values.ginkgo }}
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/main/install.sh \
        | sudo sh -s -- -b /usr/local/bin v${{ tasks.tool-versions.values.golangci-lint }}

  - key: sandbox
    use: [go-deps, go-tools]
    run: rwx-sandbox
